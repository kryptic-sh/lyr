name: CI

# Checks only for now: fmt, clippy, tests and a smoke run on Linux, macOS and
# Windows, plus dependency hygiene. The release jobs (build matrix, GitHub
# Release, crates.io, AUR, Homebrew, Scoop, Alpine) are added at the first
# release, mirroring hrdr's pipeline — see docs/plan/14-ci-and-release.md.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group:
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - run: rustup update --no-self-update stable
      - run: cargo fmt --all --check

  clippy:
    name: clippy ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run:
          cargo clippy --workspace --all-targets --all-features --locked -- -D
          warnings

  machete:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Plain `cargo audit` fails only on real vulnerabilities; unmaintained /
      # yanked advisories are warnings, matching deny.toml's policy.
      - run: cargo audit

  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run:
          cargo nextest run --workspace --all-features --locked --no-fail-fast
          --no-tests=warn
      - run: cargo test --workspace --doc --all-features --locked

  # tmxr's guard: the suite again with $HOME and the XDG directories pointed
  # at an empty sentinel, failing if a test writes there or into lyr's real
  # directories.
  leak-guard:
    name: no test writes real user state ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - shell: bash
        run: |
          set -euo pipefail
          sentinel=$(mktemp -d)
          marker=$(mktemp)
          if command -v cygpath >/dev/null; then sentinel=$(cygpath -m "$sentinel"); fi
          # cargo and rustup find their own homes through $HOME: pin the real ones.
          export CARGO_HOME=${CARGO_HOME:-$HOME/.cargo} RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}
          real_home=$HOME
          HOME=$sentinel USERPROFILE=$sentinel \
            XDG_CONFIG_HOME=$sentinel/config XDG_DATA_HOME=$sentinel/data \
            XDG_STATE_HOME=$sentinel/state XDG_CACHE_HOME=$sentinel/cache \
            cargo nextest run --workspace --all-features --locked --no-fail-fast \
            --no-tests=warn \
            && tests=0 || tests=$?
          leaked=""
          for d in config data state cache .config .local .cache; do
            if [ -e "$sentinel/$d" ]; then leaked+=$(find "$sentinel/$d"); fi
          done
          for d in .config/lyr .local/share/lyr .local/state/lyr .cache/lyr; do
            if [ -e "$real_home/$d" ]; then leaked+=$(find "$real_home/$d" -newer "$marker"); fi
          done
          if [ -n "$leaked" ]; then
            echo "tests wrote outside their own directories:" >&2
            echo "$leaked" >&2
            exit 1
          fi
          echo "leak guard: nothing written to the sentinel home or lyr's real dirs"
          exit "$tests"

  smoke:
    name: build + smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p lyr
      - run: cargo run --locked -p lyr -- --version
      - run: cargo run --locked -p lyr -- --help

  # lyr_wm::sway against a real sway: headless (wlroots' headless backend,
  # two virtual outputs, no GPU or input devices), in a private
  # XDG_RUNTIME_DIR, as crcbl's Wayland suite starts one. The test is
  # #[ignore]d everywhere else; here it runs, and fails without a sway rather
  # than skipping.
  sway-e2e:
    name: sway e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - name: Install sway
        timeout-minutes: 10
        run:
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          sway
      - name: Build the test
        run: cargo test --locked -p lyr-wm --test sway_e2e --no-run
      - name: Run it against a headless sway
        run: |
          runtime="$(mktemp -d)"
          chmod 700 "$runtime"
          export XDG_RUNTIME_DIR="$runtime"
          export WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1
          export WLR_RENDERER_ALLOW_SOFTWARE=1 WLR_HEADLESS_OUTPUTS=2
          unset WAYLAND_DISPLAY DISPLAY SWAYSOCK
          cat > "$runtime/config" <<'CONFIG'
          output HEADLESS-1 mode 1280x720@60Hz position 0 0
          output HEADLESS-2 mode 1280x720@60Hz position 1280 0
          workspace 1 output HEADLESS-1
          workspace 2 output HEADLESS-2
          workspace 1
          CONFIG
          sway --config "$runtime/config" > "$runtime/sway.log" 2>&1 &
          sway_pid=$!
          # A deadline rather than a sleep: poll for sway's IPC socket.
          deadline=$(( $(date +%s) + 20 ))
          until SWAYSOCK="$(ls "$runtime"/sway-ipc.*.sock 2>/dev/null | head -n 1)" && [ -n "$SWAYSOCK" ]; do
            if ! kill -0 "$sway_pid" 2>/dev/null || [ "$(date +%s)" -ge "$deadline" ]; then
              echo "sway did not start"; cat "$runtime/sway.log"; exit 1
            fi
            sleep 0.1
          done
          export SWAYSOCK
          status=0
          cargo test --locked -p lyr-wm --test sway_e2e -- --ignored || status=$?
          kill "$sway_pid" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then cat "$runtime/sway.log"; fi
          exit "$status"
