[package]
name = "lyr"
description = "A desktop status bar for Linux (Wayland), Windows and macOS."
keywords = ["waybar", "statusbar", "wayland", "hyprland", "desktop"]
categories = ["gui"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[[bin]]
name = "lyr"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0.104" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crcbl-shell = "=0.6.0"
hjkl-xdg = "0.42.2"
interprocess = "2.4.6"
lyr-config.workspace = true
lyr-core.workspace = true
lyr-render.workspace = true
lyr-shell.workspace = true
lyr-sources.workspace = true
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std", "registry"] }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
lyr-wm.workspace = true
tokio = { version = "1.53.3", features = ["rt", "sync", "time", "net", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
lyr-wm.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
