[package]
name = "lyr"
description = "A desktop status bar for Linux (Wayland), Windows and macOS."
keywords = ["waybar", "statusbar", "wayland", "hyprland", "desktop"]
categories = ["gui"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[[bin]]
name = "lyr"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0.104" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crcbl-shell = "=0.5.0"
interprocess = "2.4.6"
lyr-config.workspace = true
lyr-core.workspace = true
lyr-render.workspace = true
lyr-shell.workspace = true
thiserror = "2.0.21"

[lints]
workspace = true
