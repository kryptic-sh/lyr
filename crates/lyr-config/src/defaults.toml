# lyr's built-in config: a port of the waybar setup lyr replaces
# (dotfiles/.config/waybar/config.jsonc and style.css). A user file is layered
# over it: a table merges key by key, and a list replaces the whole list.
#
# [platform.linux], [platform.windows] and [platform.macos] are applied over
# the rest of this file on that platform, before the user file.

[bar]
position = "top"
height = 50
output = []
layer = "top"

[layout]
left = ["power", "battery", "power_profile", "network", "bluetooth"]
center = ["workspaces"]
right = ["tray", "volume", "mic", "clock", "notifications"]

[workspaces]
all_outputs = true
format = "{name}"
scroll = false

# Glyphs are written as escapes: they are private-use characters, which
# editors and tools drop without a trace.
[power]
format = "\uF011"
tooltip_format = "Power Button"

[power.on]
click = "open_power_menu"

[clock]
format = "%Y/%m/%d %H:%M"

[clock.on]
click = "open_clock_panel"

[notifications]
format = "{icon}"
icons = { notification = "\uF071", none = "\uF0A2", dnd-notification = "\uF071", dnd-none = "\uF1F7" }

[notifications.on]
click = "open_clock_panel"
click_right = "toggle_dnd"

[battery]
format = "{icon}"
format_charging = "{icon} \U000F140B"
format_plugged = "\uEE9E"
icons = ["\uF244", "\uF243", "\uF242", "\uF241", "\uF240"]
tooltip_format = "{capacity}% {power}W {timeTo}"
warning = 30
critical = 10

[power_profile]
format = "{icon}"
tooltip_format = "Profile: {profile}\nDriver: {driver}"
icons = { default = "\U000F04C5", performance = "\U000F04C5", balanced = "\uF24E", power-saver = "\uF06C" }

[power_profile.on]
click = "cycle_profile"
click_right = "cycle_profile_back"
click_middle = "cycle_profile_back"

[network]
format = "{icon}"
tooltip_format = "{ifname} {ipaddr}/{cidr}"
tooltip_format_wifi = "{ifname} {ipaddr}/{cidr} {essid} ({signalStrength}%)"
tooltip_format_disconnected = "YOU IN THE WOODS?"
icons = { default = "\uEF09", wifi = "\uF1EB", disconnected = "\U000F015B" }

[network.on]
click = "open_wifi_menu"

[bluetooth]
format = "{icon}"
format_on = "{icon}"
format_connected_battery = "{icon} {device_alias} {device_battery_percentage}%"
tooltip_format = "Bluetooth {status}"
icons = { default = "\U000F00AF", off = "\U000F00B2", disabled = "\U000F00B2" }

[bluetooth.on]
click = "open_bluetooth_menu"

[volume]
format = "{icon} {volume}%"
format_muted = "\uEEE8 {volume}%"
scroll_step = 5
icons = { headphone = "\uF025", hands-free = "\uF025", headset = "\uF025", phone = "\uF095", portable = "\uF095", car = "\uF1B9", default = ["\uF026", "\uF027", "\uF028"] }

[volume.on]
click = "toggle_mute"
click_right = "open_audio_menu"
scroll_up = "volume_up"
scroll_down = "volume_down"

[mic]
format = "\uF130 {volume}%"
format_muted = "\uF131 {volume}%"
scroll_step = 5

[mic.on]
click = "toggle_mute"
click_right = "open_audio_menu"
scroll_up = "volume_up"
scroll_down = "volume_down"

[theme]
font = "Hack Nerd Font Propo"
font_size = 16
foreground = "#cdd6f4"
bar_background = "#00000000"
module_background = "#1a1b26"
module_opacity = 0.8
border = "#2bc5e3"
border_width = 2
radius = 8
module_padding_x = 12
module_margin_top = 10
module_margin_bottom = 2
module_margin_left = 10
module_min_width = 20
last_module_margin_right = 10
workspace_padding_x = 10
workspace_active = "#2bc5e3"
battery_warning = "#fc4c02"
battery_critical = "#e92d4d"
volume = "#89b4fa"
mic = "#cba6f7"
tooltip_background = "#1e1e2e"
tooltip_foreground = "#cdd6f4"
# swaync's style.css in the dotfiles (Tokyo Night).
toast_background = "#24283b"
toast_foreground = "#c0caf5"
toast_border = "#73daca"
toast_border_low = "#7aa2f7"
toast_border_critical = "#f7768e"
toast_time = "#565f89"
# swaync's .control-center in the dotfiles.
panel_background = "#1a1b26"
panel_foreground = "#c0caf5"
panel_border = "#73daca"
centre_title = "#7dcfff"
switch_on = "#ff9e64"
# waybar's clock calendar format in the dotfiles.
calendar_months = "#ffead3"
calendar_days = "#ecc6d9"
calendar_weeks = "#99ffdd"
calendar_weekdays = "#ffcc66"
calendar_today = "#ff6699"

# The tray belongs to Explorer on Windows and to the menu bar on macOS, and
# macOS has no notification API, so those modules are left out there.
[platform.windows.layout]
right = ["volume", "mic", "clock", "notifications"]

[platform.macos.layout]
right = ["volume", "mic", "clock"]
