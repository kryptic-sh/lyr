[package]
name = "lyr-sources"
description = "Module data sources for lyr: audio, network, bluetooth, battery, power, tray and notifications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false }
lyr-core.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
crcbl-mixer = { git = "https://github.com/kryptic-sh/crcbl", rev = "8744e4b7", version = "0.8.1" }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync"] }
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "proxy", "service"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time"] }
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "proxy", "service", "p2p", "object-manager"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Foundation"] }
windows-core = "0.62.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFBase", "CFDictionary", "CFNumber", "CFString", "CFRunLoop"] }
objc2-core-wlan = { version = "0.3.2", default-features = false, features = ["std", "CWWiFiClient", "CWInterface"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSCalendar", "NSNotification", "NSOperation", "NSProcessInfo", "NSString"] }
objc2-io-bluetooth = { version = "0.3.2", default-features = false, features = ["std", "Bluetooth", "IOBluetoothDevice", "IOBluetoothHostController", "IOBluetoothObject", "IOBluetoothUserNotification", "objc2-foundation", "objc2"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "ps"] }
objc2-system-configuration = { version = "0.3.2", default-features = false, features = ["std", "SCDynamicStore", "SCDynamicStoreKey", "SCSchemaDefinitions"] }
