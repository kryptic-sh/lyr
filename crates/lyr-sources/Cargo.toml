[package]
name = "lyr-sources"
description = "Module data sources for lyr: audio, network, bluetooth, battery, power, tray and notifications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[dependencies]
lyr-core.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3.34", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync"] }
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "proxy", "service"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time"] }
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "proxy", "service", "p2p", "object-manager"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
